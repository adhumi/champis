# CI du référentiel : fichiers espèces, table BD Forêt, JSON, index des textes, vecteurs, illustrations.
# Bibliothèque standard de Python seulement, sans réseau. Que les vecteurs soient à jour avec les
# espèces se vérifie dans la CI de champis-api (`champis-vectors --check`), qui a le scoring.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fichiers espèces et table BD Forêt
        run: python3 species/validate.py

      - name: JSON, textes du Guide, vecteurs, illustrations
        run: python3 scripts/check_shared.py

      - name: Illustrations à jour avec leur générateur
        run: python3 scripts/draw_illustrations.py --check
